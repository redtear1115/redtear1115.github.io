name: Issue to Post

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: issue-to-post
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use GH_PAT so the post commit's push triggers the Deploy workflow.
          # Pushes made with the default GITHUB_TOKEN do NOT trigger other workflows.
          token: ${{ secrets.GH_PAT }}

      - name: Build post file
        id: build
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issue = context.payload.issue;
            const title = (issue.title || '').trim();
            const rawBody = (issue.body || '').replace(/\r\n/g, '\n');
            const createdAt = new Date(issue.created_at);
            const pubDate = createdAt.toISOString().slice(0, 10);

            // Parse frontmatter block from issue body if present
            let bodyContent = rawBody;
            let frontmatterTags = [];
            let frontmatterSlug = '';
            const fmMatch = rawBody.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
            if (fmMatch) {
              const fmBlock = fmMatch[1];
              bodyContent = fmMatch[2].trimStart();
              // Parse tags: supports both inline [a, b] and block list (- a)
              const inlineMatch = fmBlock.match(/^tags:\s*\[([^\]]*)\]/m);
              const blockMatch = fmBlock.match(/^tags:\s*\n((?:[ \t]*-[ \t]+.+\n?)+)/m);
              if (inlineMatch) {
                frontmatterTags = inlineMatch[1].split(',').map((t) => t.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
              } else if (blockMatch) {
                frontmatterTags = blockMatch[1].split('\n').map((l) => l.replace(/^[ \t]*-[ \t]+/, '').trim()).filter(Boolean);
              }
              // Parse slug
              const slugMatch = fmBlock.match(/^slug:\s*(.+)$/m);
              if (slugMatch) frontmatterSlug = slugMatch[1].trim().replace(/^["']|["']$/g, '');
            }

            // Merge: frontmatter tags take priority, label tags fill the rest
            const labelTags = (issue.labels || [])
              .map((l) => (typeof l === 'string' ? l : l.name))
              .filter((n) => typeof n === 'string' && n.startsWith('tag:'))
              .map((n) => n.slice(4));
            const tags = frontmatterTags.length ? frontmatterTags : labelTags;

            const derivedSlug = title
              .toLowerCase()
              .normalize('NFKD')
              .replace(/[̀-ͯ]/g, '')
              .replace(/[^a-z0-9\s-]/g, '')
              .trim()
              .replace(/\s+/g, '-')
              .replace(/-+/g, '-');

            const finalSlug = frontmatterSlug || derivedSlug || `post-${issue.number}`;

            const yamlString = (s) => JSON.stringify(s);
            const yamlArray = (arr) =>
              `[${arr.map((t) => JSON.stringify(t)).join(', ')}]`;

            const frontmatter = [
              '---',
              `title: ${yamlString(title)}`,
              `pubDate: ${yamlString(pubDate)}`,
              `tags: ${yamlArray(tags)}`,
              `draft: false`,
              '---',
              '',
            ].join('\n');

            const dir = 'src/content/blog';
            fs.mkdirSync(dir, { recursive: true });
            const filePath = path.join(dir, `${finalSlug}.md`);
            fs.writeFileSync(filePath, frontmatter + bodyContent + '\n');

            core.setOutput('slug', finalSlug);
            core.setOutput('title', title);
            core.setOutput('file', filePath);

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        id: verify
        run: npm run build

      - name: Comment on build failure
        if: failure() && steps.verify.conclusion == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `❌ Build failed — post was not published. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
            });

      - name: Commit and push
        env:
          POST_TITLE: ${{ steps.build.outputs.title }}
          POST_FILE: ${{ steps.build.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$POST_FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "post: $POST_TITLE"
          git push origin HEAD:master

      - name: Comment on issue
        uses: actions/github-script@v8
        env:
          POST_FILE: ${{ steps.build.outputs.file }}
          POST_SLUG: ${{ steps.build.outputs.slug }}
        with:
          script: |
            const file = process.env.POST_FILE;
            const slug = process.env.POST_SLUG;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Published: \`${file}\` → https://southern-light.dev/blog/${slug}`,
            });
