name: Daily Blog Draft

on:
  schedule:
    # 每天早上 9:00 台灣時間（UTC+8 → UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-blog-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup state.json if missing
        run: |
          if [ ! -f .github/blog-state.json ]; then
            echo '{
              "repos": {
                "oikos":        { "last_sha": "", "last_selected": "" },
                "vanishwhisper":{ "last_sha": "", "last_selected": "" },
                "wildcard":     { "last_sha": "", "last_selected": "" },
                "nebula":       { "last_sha": "", "last_selected": "" }
              }
            }' > .github/blog-state.json
          fi

      - name: Clone source repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          for repo in oikos vanishwhisper wildcard nebula; do
            git clone --quiet \
              "https://x-access-token:${GH_PAT}@github.com/redtear1115/${repo}.git" \
              "repos/${repo}" || echo "WARN: could not clone ${repo}"
          done

      - name: Pick repo and collect commits
        id: pick
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os, sys
          from datetime import datetime, timezone

          STATE_FILE = '.github/blog-state.json'
          REPOS_DIR = 'repos'
          BATCH_SIZE = 10

          with open(STATE_FILE) as f:
              state = json.load(f)

          repos = state['repos']
          candidates = []

          for name, info in repos.items():
              repo_path = f"{REPOS_DIR}/{name}"
              if not os.path.isdir(repo_path):
                  print(f"SKIP {name}: not cloned", file=sys.stderr)
                  continue

              last_sha = info.get('last_sha', '')

              # 取 last_sha 之後的 commits（時間序）
              if last_sha:
                  result = subprocess.run(
                      ['git', 'log', '--oneline', '--no-merges',
                       '--reverse', f'{last_sha}..HEAD'],
                      cwd=repo_path, capture_output=True, text=True
                  )
              else:
                  result = subprocess.run(
                      ['git', 'log', '--oneline', '--no-merges', '--reverse'],
                      cwd=repo_path, capture_output=True, text=True
                  )

              commits = [l.strip() for l in result.stdout.strip().splitlines() if l.strip()]

              if not commits:
                  print(f"SKIP {name}: no new commits", file=sys.stderr)
                  continue

              batch = commits[:BATCH_SIZE]
              last_selected = info.get('last_selected', '') or '1970-01-01T00:00:00Z'
              candidates.append({
                  'name': name,
                  'batch': batch,
                  'last_selected': last_selected,
                  'repo_path': repo_path,
              })

          if not candidates:
              print("NO_CANDIDATES", file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("has_work=false\n")
              sys.exit(0)

          # 選最久沒被選到的 repo
          candidates.sort(key=lambda c: c['last_selected'])
          chosen = candidates[0]

          batch = chosen['batch']
          repo_path = chosen['repo_path']

          # 收集這批 commits 的 diff stat
          first_sha = batch[0].split(' ')[0]
          last_sha  = batch[-1].split(' ')[0]

          diff_result = subprocess.run(
              ['git', 'diff', '--stat', f'{first_sha}^..{last_sha}'],
              cwd=repo_path, capture_output=True, text=True
          )
          diff_stat = diff_result.stdout.strip()[-3000:] if diff_result.stdout else ''

          # 也拉最後一個 commit 的完整 message（包含 body）
          msg_result = subprocess.run(
              ['git', 'log', '--format=%B', '-1', last_sha],
              cwd=repo_path, capture_output=True, text=True
          )
          last_msg = msg_result.stdout.strip()[:1000]

          # 取 commit list 文字
          commits_text = '\n'.join(batch)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"has_work=true\n")
              f.write(f"chosen_repo={chosen['name']}\n")
              f.write(f"new_last_sha={last_sha}\n")
              f.write("commits<<EOF\n")
              f.write(commits_text + "\n")
              f.write("EOF\n")
              f.write("diff_stat<<EOF\n")
              f.write(diff_stat + "\n")
              f.write("EOF\n")
              f.write("last_msg<<EOF\n")
              f.write(last_msg + "\n")
              f.write("EOF\n")

          print(f"Chosen: {chosen['name']} ({len(batch)} commits)", file=sys.stderr)
          PYEOF

      - name: Collect existing post titles
        id: existing
        run: |
          TITLES=$(find src/content/blog -name "*.md" 2>/dev/null \
            | xargs -I{} sh -c 'grep "^title:" "{}" | head -1 | sed "s/title: //" | tr -d "\"" ' \
            | paste -sd '|' -)
          echo "titles=$TITLES" >> $GITHUB_OUTPUT

      - name: Generate blog draft via Claude API
        id: generate
        if: steps.pick.outputs.has_work == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHOSEN_REPO: ${{ steps.pick.outputs.chosen_repo }}
          COMMITS: ${{ steps.pick.outputs.commits }}
          DIFF_STAT: ${{ steps.pick.outputs.diff_stat }}
          LAST_MSG: ${{ steps.pick.outputs.last_msg }}
          EXISTING_TITLES: ${{ steps.existing.outputs.titles }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          system_prompt = """你是一個工程師部落客小編，替 Ray 寫技術 blog。

Ray 是 Staff Backend Engineer，同時在做幾個 side project：
- **Futari (oikos)**：給伴侶記帳的 PWA（Next.js + Supabase + Drizzle ORM，mobile-first）
- **VanishWhisper (vanishwhisper)**：端對端加密的閱後即焚聊天 app（Firebase + Vue）
- **wildcard / nebula**：其他 side project

### 寫作人設：Cassidy Williams 風格
- **先吐槽現況，再說修了什麼**：開頭點出「之前哪裡荒謬或不對勁」，讓讀者先點頭或笑，再說這次怎麼解決
- 輕鬆但不失專業，笑點藏在技術細節裡
- 多用破折號和括號插話，像在現場說話
- 帶到後端概念（db transaction、server action、validator、RLS 等），但不貼完整 code，用一兩行說明核心邏輯就好
- **中文夾英文技術詞**（API、commit、transaction、server action、type、schema 等保留英文）
- 第一人稱「我」
- 不要用「今天」「昨天」「最近」等模糊時間詞

### 文章結構
1. 開頭吐槽（1-2 句，點出問題或荒謬的起點）
2. 這次做了什麼（2-3 段，帶到技術細節但說人話）
3. 一個有趣的小插曲、踩坑、或設計決策（讓文章有個性）
4. 結尾一句話收（簡短，帶點幽默或自嘲）

### 長度
300-500 字（中文字數）

### 輸出格式
第一行：標題（純文字，不加 # 或引號）
空一行
正文（純 markdown，段落間用空行，可用 --- 分隔區塊，不要 frontmatter）"""

          commits = os.environ.get('COMMITS', '')
          diff_stat = os.environ.get('DIFF_STAT', '')
          last_msg = os.environ.get('LAST_MSG', '')
          repo = os.environ.get('CHOSEN_REPO', '')
          existing = os.environ.get('EXISTING_TITLES', '')

          user_content = f"""請根據以下 {repo} 的 commits 寫一篇文章。

## Repo
{repo}

## Commits（時間序，舊 → 新）
{commits}

## Changed files summary
{diff_stat}

## 最後一個 commit 的完整訊息
{last_msg}

## 已存在的文章標題（請避免重複題材）
{existing}"""

          payload = {
              "model": "claude-opus-4-6",
              "max_tokens": 2048,
              "system": system_prompt,
              "messages": [{"role": "user", "content": user_content}]
          }

          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages',
              data=json.dumps(payload).encode(),
              headers={
                  'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
              }
          )

          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())

          text = data['content'][0]['text'].strip()
          lines = text.split('\n')
          title = lines[0].strip().lstrip('#').strip()
          body = '\n'.join(lines[2:]).strip() if len(lines) > 2 else ''

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("title<<EOF\n")
              f.write(title + "\n")
              f.write("EOF\n")
              f.write("body<<EOF\n")
              f.write(body + "\n")
              f.write("EOF\n")

          print(f"Generated: {title}")
          PYEOF

      - name: Open GitHub Issue as draft
        id: open_issue
        if: steps.pick.outputs.has_work == 'true'
        uses: actions/github-script@v7
        env:
          POST_TITLE: ${{ steps.generate.outputs.title }}
          POST_BODY: ${{ steps.generate.outputs.body }}
          CHOSEN_REPO: ${{ steps.pick.outputs.chosen_repo }}
          COMMITS: ${{ steps.pick.outputs.commits }}
          NEW_LAST_SHA: ${{ steps.pick.outputs.new_last_sha }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const title = process.env.POST_TITLE;
            const body = process.env.POST_BODY;
            const repo = process.env.CHOSEN_REPO;
            const commits = process.env.COMMITS;
            const sha = process.env.NEW_LAST_SHA;

            const issueBody = [
              body,
              '',
              '---',
              '',
              `<!-- source: ${repo} | last_sha: ${sha} -->`,
              `<!-- commits:`,
              commits,
              `-->`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: issueBody,
              labels: ['draft'],
            });

            core.setOutput('issue_number', issue.data.number);

      - name: Update state.json
        if: steps.pick.outputs.has_work == 'true'
        env:
          CHOSEN_REPO: ${{ steps.pick.outputs.chosen_repo }}
          NEW_LAST_SHA: ${{ steps.pick.outputs.new_last_sha }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          STATE_FILE = '.github/blog-state.json'

          with open(STATE_FILE) as f:
              state = json.load(f)

          repo = os.environ['CHOSEN_REPO']
          sha  = os.environ['NEW_LAST_SHA']
          now  = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          state['repos'][repo]['last_sha'] = sha
          state['repos'][repo]['last_selected'] = now

          with open(STATE_FILE, 'w') as f:
              json.dump(state, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f"Updated state: {repo} → {sha}")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/blog-state.json
          git diff --cached --quiet || git commit -m "chore(blog-state): advance ${CHOSEN_REPO} to ${NEW_LAST_SHA}"
          git push origin HEAD:master

      - name: No work summary
        if: steps.pick.outputs.has_work != 'true'
        run: echo "All repos fully covered — no new commits to write about."
